<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Subsea cable crossing an ocean globe">
  <!--
    A cable crossing an ocean sphere, over bathymetric depth contours.

    Designed for 16 px first. Everything here survives that size: one dark
    sphere, one bright arc, two landing points. The depth contours and the
    highlight are deliberately low-contrast so they add depth when the icon is
    shown large (tab bar on a hidpi screen, bookmarks, PWA) and simply merge
    into the sphere when it is tiny, rather than turning it to mud.

    Palette matches the application: abyssal navy ground, contour teal, and the
    sky blue used for source landing points.
  -->
  <defs>
    <!-- Lit from upper-left, like the globe in the app. -->
    <radialGradient id="ocean" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#1c4a63"/>
      <stop offset="55%" stop-color="#0e2f45"/>
      <stop offset="100%" stop-color="#06192a"/>
    </radialGradient>
    <linearGradient id="cable" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- Clips the contours to the sphere so they cannot bleed past the limb. -->
    <clipPath id="sphere">
      <circle cx="16" cy="16" r="14.5"/>
    </clipPath>
  </defs>

  <circle cx="16" cy="16" r="14.5" fill="url(#ocean)"/>

  <g clip-path="url(#sphere)" fill="none" stroke="#5eead4" stroke-linecap="round">
    <!-- Bathymetric depth contours: shallower nearer the limb, as on a chart. -->
    <path d="M-2 23.5c7-3.2 15-3.2 22 0s13 3.2 20 0" stroke-opacity=".16" stroke-width="1"/>
    <path d="M-2 27.5c7-3.2 15-3.2 22 0s13 3.2 20 0" stroke-opacity=".1" stroke-width="1"/>
  </g>

  <!-- The cable. Widest element by design: it is what the icon is about. -->
  <path d="M4.2 21.6C9 12.4 23 12.4 27.8 8.6"
        fill="none" stroke="url(#cable)" stroke-width="3.1" stroke-linecap="round"/>

  <!-- Landing points, sized to stay visible at 16 px. -->
  <circle cx="4.2" cy="21.6" r="2.5" fill="#e8f6fb"/>
  <circle cx="27.8" cy="8.6" r="2.5" fill="#e8f6fb"/>

  <!-- Limb, last so it sits over everything.
       Deliberately not subtle: the sphere is dark, and on a dark browser tab
       strip a low-contrast edge lets the whole icon dissolve into the chrome.
       This ring is what keeps it reading as a disc on either background. -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#5eead4" stroke-opacity=".55" stroke-width="1.2"/>
</svg>
