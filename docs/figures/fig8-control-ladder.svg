<svg xmlns="http://www.w3.org/2000/svg" width="252" height="168" viewBox="0 0 252 168" font-family="Times New Roman, Times, Georgia, serif" role="img" aria-labelledby="t d">
<title id="t">The corridor effect under successive controls</title><desc id="d">The corridor proximity effect measured against a displaced control, as each confound is removed: identity exclusion alone gives 68%, trimming the landfall approaches and excluding cables sharing a named landing point brings it to 29%.</desc>
<rect width="252" height="168" fill="#ffffff"/>
<line x1="96" y1="20" x2="96" y2="138" stroke="#e4e3df" stroke-width="0.6"/><text x="96" y="148" font-size="6.2" fill="#8a8983" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">0%</text><line x1="126" y1="20" x2="126" y2="138" stroke="#e4e3df" stroke-width="0.6"/><text x="126" y="148" font-size="6.2" fill="#8a8983" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">20%</text><line x1="156" y1="20" x2="156" y2="138" stroke="#e4e3df" stroke-width="0.6"/><text x="156" y="148" font-size="6.2" fill="#8a8983" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">40%</text><line x1="186" y1="20" x2="186" y2="138" stroke="#e4e3df" stroke-width="0.6"/><text x="186" y="148" font-size="6.2" fill="#8a8983" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">60%</text><line x1="216" y1="20" x2="216" y2="138" stroke="#e4e3df" stroke-width="0.6"/><text x="216" y="148" font-size="6.2" fill="#8a8983" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">80%</text><text x="156" y="162" font-size="6.6" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">how much closer than the displaced control</text><text x="96" y="14" font-size="6.2" fill="#8a8983" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="italic">each row removes one more confound</text><rect x="96" y="32.2" width="102.35596380507792" height="10" rx="1.5" fill="#1baf7a" fill-opacity="0.42"/><text x="91" y="39.6" font-size="6.3" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">same-agency excluded</text><text x="202.35596380507792" y="39.6" font-size="6.4" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">68%</text><text x="220.35596380507792" y="39.6" font-size="5.8" fill="#8a8983" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">n=301</text><rect x="96" y="54.599999999999994" width="88.21524226124131" height="10" rx="1.5" fill="#1baf7a" fill-opacity="0.42"/><text x="91" y="61.99999999999999" font-size="6.3" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">+ trim 10 km</text><text x="188.21524226124131" y="61.99999999999999" font-size="6.4" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">59%</text><text x="206.21524226124131" y="61.99999999999999" font-size="5.8" fill="#8a8983" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">n=227</text><rect x="96" y="77" width="76.38075192515538" height="10" rx="1.5" fill="#1baf7a" fill-opacity="0.42"/><text x="91" y="84.4" font-size="6.3" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">+ trim 30 km</text><text x="176.38075192515538" y="84.4" font-size="6.4" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">51%</text><text x="194.38075192515538" y="84.4" font-size="5.8" fill="#8a8983" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">n=183</text><rect x="96" y="99.39999999999999" width="72.5493815822087" height="10" rx="1.5" fill="#1baf7a" fill-opacity="0.42"/><text x="91" y="106.8" font-size="6.3" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">+ trim 50 km</text><text x="172.5493815822087" y="106.8" font-size="6.4" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">48%</text><text x="190.5493815822087" y="106.8" font-size="5.8" fill="#8a8983" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">n=158</text><rect x="96" y="121.8" width="42.911631919848844" height="10" rx="1.5" fill="#2a78d6" fill-opacity="1"/><text x="91" y="129.2" font-size="6.3" fill="#0b0b0b" text-anchor="end" font-weight="bold" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">+ shared landfall excl.</text><text x="142.91163191984884" y="129.2" font-size="6.4" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">29%</text><text x="160.91163191984884" y="129.2" font-size="5.8" fill="#8a8983" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">n=182</text>
</svg>