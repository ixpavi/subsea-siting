<svg xmlns="http://www.w3.org/2000/svg" width="252" height="176" viewBox="0 0 252 176" font-family="Times New Roman, Times, Georgia, serif" role="img" aria-labelledby="t d">
<title id="t">The evaluation protocol</title><desc id="d">Each method receives only the two endpoints, predicts a route, and is scored by mean distance from the cable actually laid. All terrain-aware methods share one A* search, grid and endpoint handling, so differences are attributable to the cost weights.</desc>
<rect width="252" height="176" fill="#ffffff"/>
<rect x="8" y="10" width="236" height="30" rx="2" fill="#f7f9fa" stroke="#e4e3df" stroke-width="1"/><text x="14" y="22" font-size="6" fill="#8a8983" text-anchor="start" font-weight="bold" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">GIVEN</text><text x="14" y="33" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">two endpoints only — no route, no hint</text><circle cx="196" cy="26" r="3" fill="#0b0b0b"/><circle cx="228" cy="26" r="3" fill="#0b0b0b"/><line x1="199" y1="26" x2="225" y2="26" stroke="#e4e3df" stroke-width="1" stroke-dasharray="2 2"/><rect x="8" y="50" width="236" height="46" rx="2" fill="#ffffff" stroke="#2a78d6" stroke-width="1"/><text x="14" y="62" font-size="6" fill="#2a78d6" text-anchor="start" font-weight="bold" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">EACH METHOD PREDICTS</text><rect x="16" y="68" width="50" height="18" rx="2" fill="#8a8983" fill-opacity="0.11" stroke="#8a8983" stroke-width="0.8"/><text x="41" y="80" font-size="6.2" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">great circle</text><rect x="72" y="68" width="50" height="18" rx="2" fill="#eb6834" fill-opacity="0.11" stroke="#eb6834" stroke-width="0.8"/><text x="97" y="80" font-size="6.2" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">sea path</text><rect x="128" y="68" width="50" height="18" rx="2" fill="#4a3aa7" fill-opacity="0.11" stroke="#4a3aa7" stroke-width="0.8"/><text x="153" y="80" font-size="6.2" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">terrain</text><rect x="184" y="68" width="50" height="18" rx="2" fill="#2a78d6" fill-opacity="0.11" stroke="#2a78d6" stroke-width="0.8"/><text x="209" y="80" font-size="6.2" fill="#0b0b0b" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">corridor</text><text x="126" y="92.5" font-size="5.8" fill="#8a8983" text-anchor="middle" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="italic">same A* · same grid · same endpoints</text><rect x="8" y="106" width="236" height="34" rx="2" fill="#ffffff" stroke="#1baf7a" stroke-width="1"/><text x="14" y="118" font-size="6" fill="#1baf7a" text-anchor="start" font-weight="bold" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">SCORED AGAINST</text><text x="14" y="130" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">the cable that was actually laid — mean km apart</text><line x1="126" y1="40" x2="126" y2="46" stroke="#52514e" stroke-width="1"/><polygon points="126,50 123,45.5 129,45.5" fill="#52514e"/><line x1="126" y1="96" x2="126" y2="102" stroke="#52514e" stroke-width="1"/><polygon points="126,106 123,101.5 129,101.5" fill="#52514e"/><rect x="8" y="148" width="236" height="22" rx="2" fill="#fdf6f2" stroke="#eb6834" stroke-width="1" stroke-dasharray="3 2"/><text x="14" y="157" font-size="6" fill="#eb6834" text-anchor="start" font-weight="bold" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">CONTROL</text><text x="52" y="157" font-size="6.4" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">every grid search carries a 7.85 km discretisation</text><text x="14" y="166.5" font-size="6.4" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">handicap. It cancels between two of them, and never against the great circle.</text>
</svg>