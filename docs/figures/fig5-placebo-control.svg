="58.46153846153847" x2="166.69230769230768" y2="58.46153846153847" stroke="#eb6834" stroke-width="0.8"/><text x="169.69230769230768" y="60.861538461538466" font-size="6.8" fill="#eb6834" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">displaced control</text><text x="12" y="14" font-size="6.6" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">The control shares the route's shape, length and heading,</text><text x="12" y="22" font-size="6.6" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Times New Roman, Times, Georgia, serif" font-style="normal">and differs only in where it sits.</text>
